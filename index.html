<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillyFX | Deriv Trading Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px 12px;
      background: #17243a;
      border-bottom: 2px solid #16c784;
    }
    h1 { color: #16c784; }
    main {
      max-width: 500px;
      margin: 28px auto;
      padding: 20px;
    }
    .panel {
      background: #1c2b42;
      padding: 22px;
      border-radius: 12px;
      margin: 18px 0;
    }
    button {
      background: #16c784;
      color: #07140e;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    .note { color: #c6d2e1; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>BillyFX</h1>
    <p>Deriv Synthetic Indices Trading Assistant</p>
  </header>
  <main>
    <div class="panel">
      <h2>Welcome to BillyFX</h2>
      <p class="note">Your trading dashboard starts here.</p>
      <p id="status">Connection status: Not connected</p>
      <button onclick="connectDemo()">Connect Demo Account</button>
    </div>
    <div class="panel">
      <h3>Trading Safety</h3>
      <p class="note">Demo testing first. Automatic trading is not enabled.</p>
      <p>Market: Synthetic Indices</p>
    </div>
  </main>
  <script>
    function connectDemo() {
      document.getElementById("status").textContent =
        "Connection status: Deriv API setup required";
      alert("Next step: configure a secure Deriv API connection.");
    }
  </script>
</body>
</html>
