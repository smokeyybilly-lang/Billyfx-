<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillyFX | Deriv Trading Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px 12px;
      background: #17243a;
      border-bottom: 2px solid #16c784;
    }
    h1 { color: #16c784; }
    main {
      max-width: 500px;
      margin: 28px auto;
      padding: 20px;
    }
    .panel {
      background: #1c2b42;
      padding: 22px;
      border-radius: 12px;
      margin: 18px 0;
    }
    button {
      background: #16c784;
      color: #07140e;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    .note { color: #c6d2e1; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>BillyFX</h1>
    <p>Deriv Synthetic Indices Trading Assistant</p>
  </header>
  <main>
    <div class="panel">
      <h2>Welcome to BillyFX</h2>
      <p class="note">Your trading dashboard starts here.</p>
      <p id="status">Connection status: Not connected</p>
      <button onclick="connectDemo()">Connect Demo Account</button>
    </div>
    <div class="panel">
      <h3>Trading Safety</h3>
      <p class="note">Demo testing first. Automatic trading is not enabled.</p>
      <p>Market: Synthetic Indices</p>
    </div>
  </main>
  <script>
    function connectDemo() {
      document.getElementById("status").textContent =
        "Connection status: Deriv API setup required";
      alert("Next step: configure a secure Deriv API connection.");
    }
  </script>
</body>
</html>
<div id="billyfx-deriv">
  <h3>BillyFX — Deriv Demo Connection</h3>
  <label for="deriv-token">Deriv API token</label>
  <input id="deriv-token" type="password"
         placeholder="Paste demo token here" autocomplete="off" />
  <button id="deriv-connect">Connect Demo</button>
  <p id="deriv-status">Not connected</p>
</div>

<script>
document.getElementById("deriv-connect").onclick = async () => {
  const token = document.getElementById("deriv-token").value.trim();
  const status = document.getElementById("deriv-status");
  if (!token) {
    status.textContent = "Enter your demo token.";
    return;
  }
  status.textContent = "Connecting...";
  let ws;
  try {
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=34zW4CzXeewGNJaa6zLzq;
    ws.onopen = () => ws.send(JSON.stringify({
      authorize: token
    }));
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.error) {
        status.textContent = "Connection failed: " + data.error.message;
        ws.close();
      } else if (data.msg_type === "authorize") {
        status.textContent = "Demo connected successfully!";
        ws.close();
      }
    };
    ws.onerror = () => {
      status.textContent = "Connection error. Check your App ID and internet.";
    };
  } catch (e) {
    status.textContent = "Could not connect.";
    if (ws) ws.close();
  }
};
  </script>
